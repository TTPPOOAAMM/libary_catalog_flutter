<!DOCTYPE html>
<html>
<head>
  <base href="/libary_catalog_flutter/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Библиотечный каталог Flutter Web.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Библиотечный каталог">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Библиотечный каталог</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #loading-splash {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .splash-title {
      font-size: 24px;
      font-weight: 600;
      color: #303f9f;
      margin-top: 16px;
      letter-spacing: 0.5px;
    }
    .splash-subtitle {
      font-size: 14px;
      color: #757575;
      margin-top: 6px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #3f51b5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="spinner"></div>
    <div class="splash-title">Библиотечный каталог</div>
    <div class="splash-subtitle">Инициализация веб-приложения...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
